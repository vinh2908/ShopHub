services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shophub
      POSTGRES_USER: shophub
      POSTGRES_PASSWORD: shophub
    ports:
      - "5432:5432"
    volumes:
      - shophub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shophub -d shophub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://shophub:shophub@postgres:5432/shophub
      REDIS_URL: redis://redis:6379
      PORT: 3000
      PAYMENT_FAILURE_RATE: 0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  shophub_pgdata:
